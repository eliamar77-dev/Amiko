<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amico Pro</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

  <style>
    :root { --dark: #2c3e50; --bg: #f4f7f9; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; padding: 10px; background-color: var(--bg);
      font-family: 'Assistant', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      height: 100vh; overflow: hidden;
    }

    .app-header { text-align: center; margin-bottom: 10px; }
    .app-header h1 { font-size: 2rem; margin: 0; color: var(--dark); }
    .app-header p { margin: 4px 0; color: #636e72; font-size: 1.1rem; font-weight: 500; }

    #video-container {
      width: 100%; max-width: 340px; aspect-ratio: 1/1;
      background: #000; border-radius: 40px;
      overflow: hidden; position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 15px;
    }

    video, canvas { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      object-fit: cover;
    }

    .btn-group { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px; }

    .main-btn {
      background: var(--dark); color: white; border: none;
      padding: 14px; border-radius: 50px; font-size: 1.2rem; font-weight: bold;
      cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .secondary-btn {
      background: #e1e8ed; border: none; color: var(--dark);
      padding: 10px; border-radius: 50px; font-size: 1rem; font-weight: bold;
      cursor: pointer; width: 100%;
    }

    .results-grid {
      width: 100%; max-width: 340px; display: grid;
      grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px;
    }

    .result-card {
      background: white; padding: 10px; border-radius: 15px;
      text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex; flex-direction: column; border: 2px solid transparent;
    }

    .result-card.alert { border-color: #e67e22; background: #fff9f0; }
    .label { font-size: 0.75rem; color: #636e72; margin-bottom: 2px; }
    .value { font-size: 0.9rem; font-weight: bold; color: var(--dark); }

    .tip-box {
      margin-top: auto; padding: 10px 15px; background: #fff9db;
      border-radius: 12px; font-size: 0.85rem; color: #856404;
      display: flex; align-items: center; gap: 8px; width: 100%; max-width: 340px;
      margin-bottom: 10px;
    }

    #flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: white; opacity: 0; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>✨ עמיקו</h1>
    <p>למה לצאת ככה מהבית 🙂</p>
  </div>

  <div id="video-container">
    <video id="input_video" playsinline webkit-playsinline muted></video>
    <canvas id="output_canvas"></canvas>
    <div id="flash"></div>
  </div>

  <div class="btn-group">
    <button id="capture-btn" class="main-btn">📸 צלם תמונה</button>
    <button id="scan-btn" class="main-btn" style="display: none;">🔍 התחל סריקה</button>
    <button id="reset-btn" class="secondary-btn" style="display: none;">🔄 צילום חדש</button>
  </div>

  <div class="results-grid" id="results-box">
    <div class="result-card" id="row-dye"><span class="label">צבע שיער:</span><span class="value">-</span></div>
    <div class="result-card" id="row-hair"><span class="label">תספורת:</span><span class="value">-</span></div>
    <div class="result-card" id="row-eyebrows"><span class="label">גבות:</span><span class="value">-</span></div>
    <div class="result-card" id="row-mustache"><span class="label">שפם:</span><span class="value">-</span></div>
    <div class="result-card" id="row-beard"><span class="label">זקן:</span><span class="value">-</span></div>
  </div>

  <div class="tip-box">
    💡 נדרש לוודא צילום בתאורה טובה לדיוק מקסימלי
  </div>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d', {willReadFrequently: true});
const captureBtn = document.getElementById('capture-btn');
const scanBtn = document.getElementById('scan-btn');
const resetBtn = document.getElementById('reset-btn');
const flash = document.getElementById('flash');

let isFrozen = false;
let lastResult = null;

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6 });
faceMesh.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => { if (!isFrozen) await faceMesh.send({image: videoElement}); },
  width: 640, height: 480
});
camera.start();

function onResults(results) {
  const vWidth = results.image.width;
  const vHeight = results.image.height;
  
  if (!canvasElement.width) {
    canvasElement.width = 640;
    canvasElement.height = 640;
  }

  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  
  const minSide = Math.min(vWidth, vHeight);
  const sx = (vWidth - minSide) / 2;
  const sy = (vHeight - minSide) / 2;

  canvasCtx.drawImage(results.image, sx, sy, minSide, minSide, 0, 0, canvasElement.width, canvasElement.height);

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    lastResult = results.multiFaceLandmarks[0].map(p => ({
        x: (p.x * vWidth - sx) / minSide,
        y: (p.y * vHeight - sy) / minSide,
        z: p.z
    }));
  }
  canvasCtx.restore();
}

function analyzeGrooming() {
  if (!lastResult) return;
  const getBrightness = (p) => {
    const x = Math.max(0, Math.min(canvasElement.width - 1, Math.floor(p.x * canvasElement.width)));
    const y = Math.max(0, Math.min(canvasElement.height - 1, Math.floor(p.y * canvasElement.height)));
    const d = canvasCtx.getImageData(x, y, 1, 1).data;
    return (d[0] + d[1] + d[2]) / 3;
  };

  const skin = getBrightness(lastResult[10]); 
  const hair = getBrightness({ x: lastResult[10].x, y: lastResult[10].y - 0.08 });
  const dyeRatio = hair / skin;

  updateCard('dye', dyeRatio > 0.85, "צריך לצבוע", "צבע תקין");
  updateCard('hair', (hair / skin) < 0.70, "להסתפר", "מסודר");
  updateCard('eyebrows', (getBrightness(lastResult[285]) / skin) < 0.75, "לסדר", "תקין");
  const mP = {x: (lastResult[205].x + lastResult[425].x)/2, y: (lastResult[205].y + lastResult[425].y)/2};
  updateCard('mustache', (getBrightness(mP) / skin) < 0.82, "יש צמיחה", "חלק");
  updateCard('beard', (getBrightness(lastResult[152]) / skin) < 0.82, "להתגלח", "מגולח");
}

function updateCard(id, cond, act, ok) {
  const card = document.getElementById(`row-${id}`);
  const val = card.querySelector('.value');
  val.innerText = cond ? act : ok;
  card.className = 'result-card' + (cond ? ' alert' : '');
}

captureBtn.onclick = () => {
  flash.style.opacity = "1";
  setTimeout(() => flash.style.opacity = "0", 150);
  isFrozen = true;
  videoElement.pause();
  captureBtn.style.display = 'none';
  scanBtn.style.display = 'flex';
  resetBtn.style.display = 'block';
};

scanBtn.onclick = () => { analyzeGrooming(); scanBtn.style.display = 'none'; };

resetBtn.onclick = () => {
  isFrozen = false; videoElement.play();
  captureBtn.style.display = 'flex';
  scanBtn.style.display = 'none'; resetBtn.style.display = 'none';
  document.querySelectorAll('.value').forEach(v => v.innerText = '-');
  document.querySelectorAll('.result-card').forEach(c => c.className = 'result-card');
};
</script>
</body>
</html>
